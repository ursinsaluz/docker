services:
  server:
    image: cortezaproject/corteza:latest
    restart: always
    env_file: [ .env ]
    depends_on: [ db ]
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.corteza.rule=Host(`corteza.docker.localhost`)"
      - "traefik.http.routers.corteza.entrypoints=websecure"
      - "traefik.http.routers.corteza.tls=true"
      - "traefik.http.services.corteza.loadbalancer.server.port=80"
    ports: [ "18080:80" ]

  db:
    # PostgreSQL Database
    image: postgres:15
    restart: always
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U corteza"], interval: 10s, timeout: 5s, retries: 5 }
    volumes:
      - "dbdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER:     corteza
      POSTGRES_PASSWORD: corteza

networks:
  web:
    external: true

volumes:
  dbdata: