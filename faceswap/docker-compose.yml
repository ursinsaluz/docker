version: "3.8"

services:
  faceswap-cpu:
    image: faceswap-cpu
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $HOME/.Xauthority:/root/.Xauthority
    environment:
      - DISPLAY=${DISPLAY}
    command: "bash -c 'xauth nlist $DISPLAY | sed -e \"s/^..../ffff/\" | xauth -f /root/.Xauthority nmerge - && /bin/bash'"
    ports:
      - "8888:8888"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.faceswap.rule=Host(`faceswap.docker.localhost`)"
      - "traefik.http.routers.faceswap.entrypoints=websecure"
      - "traefik.http.routers.faceswap.tls=true"
      - "traefik.http.services.faceswap.loadbalancer.server.port=8888"
    networks:
      - web

networks:
  web:
    external: true
