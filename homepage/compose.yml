services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: gethomepage.dev,homepage.docker.localhost:3030,127.0.0.1:3000,127.0.0.1:3030 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`homepage.docker.localhost`)
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"
    ports:
      - 127.0.0.1:3030:3000
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    networks:
      - default
      - web
    restart: unless-stopped

networks:
  default:
    driver: bridge
  web:
    external: true
